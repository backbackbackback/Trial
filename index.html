<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starline Defense</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header>
      <h1>Starline Defense</h1>
      <p>Defend the starline. Arrow keys move, space fires, <kbd>P</kbd> pauses.</p>
    </header>

    <section class="hud">
      <div class="stat">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="stat">
        <span>Wave</span>
        <strong id="wave">1</strong>
      </div>
      <div class="stat">
        <span>Lives</span>
        <strong id="lives">3</strong>
      </div>
      <button id="restart" type="button">Restart</button>
    </section>

    <main>
      <div class="frame">
        <canvas id="game" width="900" height="600" aria-label="Space defense game"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlay-title">Ready</h2>
          <p id="overlay-message">Press Space to launch the next wave.</p>
        </div>
      </div>
    </main>

    <footer>
      <p>Destroy incoming fleets before they breach the defense line.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
